name: sankiwork

services:
  sankiwork:
    container_name: sankiwork
    image: ${SANKIWORK_IMAGE:-ghcr.io/nexu-io/od:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      SW_BIND_HOST: 0.0.0.0
      SW_ALLOWED_ORIGINS: ${SANKIWORK_ALLOWED_ORIGINS:-}
      SW_PORT: 7456
      SW_WEB_PORT: ${SANKIWORK_PORT:-7456}
      SW_API_TOKEN: ${SW_API_TOKEN:-}
      SW_DISABLE_API_AUTH: ${SANKIWORK_DISABLE_API_AUTH:-}
      SW_CODEX_SANDBOX: ${SW_CODEX_SANDBOX:-}
    ports:
      - "127.0.0.1:${SANKIWORK_PORT:-7456}:7456"
    volumes:
      - sankiwork_data:/app/.sankiwork
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SANKIWORK_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sankiwork_data:
